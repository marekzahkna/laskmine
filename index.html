<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasketulemuste Tuvastaja v1.3</title>
    <!-- Kasutame Sinu üleslaetud kohalikku teeki -->
    <script src="tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .version-tag { font-size: 0.85em; color: #777; background: #eaeaea; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        #preview { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #status { font-weight: bold; color: #0066cc; margin: 15px 0; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .result-table th, .result-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .result-table th { background-color: #4CAF50; color: white; }
        .result-table tr:nth-child(even) { background-color: #f2f2f2; }
        .total-row { font-weight: bold; background-color: #eef9f3 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lasketulemuste pildituvastus</h2>
    <!-- Versioonitähis, et näha brauseris kohe, milline kood töötab -->
    <div class="version-tag">Rakenduse versioon: v1.3 (Parandatud tabeli filter)</div>
    
    <br>
    <input type="file" id="imageInput" accept="image/*">
    <div id="status">Ootan lasketulemuste pilti...</div>

    <h3>Eelvaade:</h3>
    <img id="preview" src="#" alt="Eelvaade" style="display:none;">

    <h3>Tuvastatud lasketulemused:</h3>
    <div id="tableOutput">Tulemused ilmuvad siia pärast pildi valimist...</div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const statusDiv = document.getElementById('status');
    const tableOutput = document.getElementById('tableOutput');

    imageInput.addEventListener('change', async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';

        statusDiv.innerText = "Analüüsin lasketabelit... Palun oota.";
        tableOutput.innerHTML = "Töötlen...";

        try {
            // Käivitame töötaja Sinu GitHubi üleslaetud abifailidega
            const worker = await Tesseract.createWorker('eng', 1, {
                workerPath: './worker.min.js',
                langPath: '.',
                cacheMethod: 'none'
            });

            // Lubame ainult numbreid ja kirjavahemärke, et tekstiprügi eemaldada
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789., \n'
            });

            const { data: { text } } = await worker.recognize(file);
            await worker.terminate();

            statusDiv.innerText = "Tuvastamine edukalt lõpetatud!";
            TöötleTekst(text);

        } catch (error) {
            statusDiv.innerText = "Viga tuvastamisel!";
            tableOutput.innerText = error.message;
        }
    });

    function TöötleTekst(toorTekst) {
        const read = toorTekst.split('\n');
        let lasud = {};
        
        // Rangem filter: rida peab algama numbriga 1-5, millele järgneb tühik ja kümnendmurd (nt 9.6)
        const tabeliMuster = /^\s*([1-5])\s+([0-9][.,][0-9])/;

        read.forEach(rida => {
            const vaste = rida.trim().match(tabeliMuster);
            if (vaste) {
                const lasuNr = parseInt(vaste[1]);
                const tulemus = parseFloat(vaste[2].replace(',', '.'));
                // Kontrollime, et punktid jääksid reaalsuse piiridesse
                if (tulemus <= 11.0) {
                    lasud[lasuNr] = tulemus;
                }
            }
        });

        // Alternatiivne leidja juhuks, kui tabeli struktuur sai viga, kuid numbrid on olemas
        if (Object.keys(lasud).length === 0) {
            const koikKümnendmurrud = toorTekst.match(/[0-9][.,][0-9]/g);
            if (koikKümnendmurrud) {
                let loendur = 1;
                koikKümnendmurrud.forEach(num => {
                    const väärtus = parseFloat(num.replace(',', '.'));
                    // Välistame lehe all nurgas olevad liiga suured numbrid (nt distantsid või koordinaadid)
                    if (väärtus <= 10.9 && loendur <= 5) {
                        lasud[loendur] = väärtus;
                        loendur++;
                    }
                });
            }
        }

        // Koostame ilusa HTML tabeli
        if (Object.keys(lasud).length > 0) {
            let tabeliHtml = `<table class="result-table">
                <tr><th>Lasu nr</th><th>Algne tulemus</th><th>Ümardatud (allapoole)</th></tr>`;
            
            let algneSumma = 0;
            let ümardatudSumma = 0;

            for (let i = 1; i <= 5; i++) {
                let väärtus = lasud[i] !== undefined ? lasud[i] : 0;
                let ümardatud = lasud[i] !== undefined ? Math.floor(lasud[i]) : 0;
                
                algneSumma += väärtus;
                ümardatudSumma += ümardatud;

                tabeliHtml += `<tr><td>${i}. lask</td><td>${väärtus > 0 ? väärtus.toFixed(1) : '-'}</td><td><strong>${väärtus > 0 ? ümardatud : '-'}</strong></td></tr>`;
            }

            tabeliHtml += `<tr class="total-row"><td>KOKKU</td><td>${algneSumma.toFixed(1)}</td><td>${ümardatudSumma}</td></tr>`;
            tabeliHtml += `</table>`;
            
            tableOutput.innerHTML = tabeliHtml;
        } else {
            tableOutput.innerHTML = "<p style='color:red;'>Tulemusi ei suudetud automaatselt tabelisse panna. Proovi teha pilti otse mustvalge tabeli lähedalt.</p>";
        }
    }
</script>

</body>
</html>
