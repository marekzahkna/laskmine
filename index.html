<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasketulemuste Tuvastaja v1.4</title>
    <!-- Kohalik teek -->
    <script src="tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .version-tag { font-size: 0.85em; color: #777; background: #eaeaea; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        #preview, #croppedCanvas { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; display: block; }
        #status { font-weight: bold; color: #0066cc; margin: 15px 0; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .result-table th, .result-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .result-table th { background-color: #4CAF50; color: white; }
        .result-table tr:nth-child(even) { background-color: #f2f2f2; }
        .total-row { font-weight: bold; background-color: #eef9f3 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lasketulemuste pildituvastus</h2>
    <div class="version-tag">Rakenduse versioon: v1.4 (Automaatne tabeli kärpimine)</div>
    
    <br>
    <input type="file" id="imageInput" accept="image/*">
    <div id="status">Ootan lasketulemuste pilti...</div>

    <div class="hidden">
        <!-- Taustal olev lõuend pildi kärpimiseks -->
        <canvas id="sourceCanvas"></canvas>
    </div>

    <h3>Tuvastatav tabeliosa (Koodi poolt välja lõigatud):</h3>
    <canvas id="croppedCanvas"></canvas>

    <h3>Tuvastatud lasketulemused:</h3>
    <div id="tableOutput">Tulemused ilmuvad siia...</div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const sourceCanvas = document.getElementById('sourceCanvas');
    const croppedCanvas = document.getElementById('croppedCanvas');
    const statusDiv = document.getElementById('status');
    const tableOutput = document.getElementById('tableOutput');

    imageInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        statusDiv.innerText = "Valmistun pildi kärpimiseks...";
        tableOutput.innerHTML = "Töötlen...";

        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = async function() {
            // 1. Joonistame algse pildi taustalõuendile
            const srcCtx = sourceCanvas.getContext('2d');
            sourceCanvas.width = img.width;
            sourceCanvas.height = img.height;
            srcCtx.drawImage(img, 0, 0);

            // 2. KÄRPIMISE LOOGIKA: Kongsbergi ekraanil asub tulemuste tabel üleval paremas nurgas.
            // Võtame pildi laiusest viimase 40% (parem serv) ja kõrgusest esimese 45% (ülemine pool)
            const cropX = img.width * 0.60; 
            const cropY = img.height * 0.05;
            const cropWidth = img.width * 0.38;
            const cropHeight = img.height * 0.45;

            // Seadistame nähtava lõuendi suuruse lõigatud tüki järgi
            croppedCanvas.width = cropWidth;
            croppedCanvas.height = cropHeight;
            const cropCtx = croppedCanvas.getContext('2d');
            
            // Lõikame tabeli välja ja joonistame selle ekraanile
            cropCtx.drawImage(sourceCanvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            statusDiv.innerText = "Tabel välja lõigatud! Käivitan tekstituvastuse ainult tabelist...";

            // 3. SAADAME TESSERACTILE AINULT KÄRPITUD TABELIPIIRKONNA
            KäivitaTuvastus(croppedCanvas);
        };
    });

    async function KäivitaTuvastus(canvasElement) {
        try {
            const worker = await Tesseract.createWorker('eng', 1, {
                workerPath: './worker.min.js',
                langPath: '.',
                cacheMethod: 'none'
            });

            // Lubame ainult numbreid ja punkte, et välistada ekraani nurkadest tulevat tekstiprügi
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789.\n '
            });

            // Tuvastame teksti otse canvas elemendilt
            const { data: { text } } = await worker.recognize(canvasElement);
            await worker.terminate();

            statusDiv.innerText = "Tuvastamine edukalt lõpetatud!";
            TöötleTabeliTekst(text);

        } catch (error) {
            statusDiv.innerText = "Viga tuvastamisel!";
            tableOutput.innerText = error.message;
        }
    }

    function TöötleTabeliTekst(toorTekst) {
        // Otsime tekstist kõiki kümnendmurde (nt 9.6, 5.6 jne)
        const leitudNumbrid = toorTekst.match(/[0-9]\s*[.,]\s*[0-9]/g) || [];
        
        let puhastatudTulemused = [];
        leitudNumbrid.forEach(num => {
            // Eemaldame võimalikud tühikud, mis OCR võib punkti vahele jätta (nt "9 . 6")
            const puhasArv = parseFloat(num.replace(/\s+/g, '').replace(',', '.'));
            if (puhasArv <= 10.9 && puhasArv >= 0.0) {
                puhastatudTulemused.push(puhasArv);
            }
        });

        // Kuna lõikasime välja ainult tabeli, on esimesed 5 leitud numbrit garanteeritult Sinu lasud!
        const lõplikudLasud = puhastatudTulemused.slice(0, 5);

        if (lõplikudLasud.length > 0) {
            let tabeliHtml = `<table class="result-table">
                <tr><th>Lasu nr</th><th>Algne tulemus</th><th>Ümardatud (allapoole)</th></tr>`;
            
            let algneSumma = 0;
            let ümardatudSumma = 0;

            for (let i = 0; i < 5; i++) {
                let väärtus = lõplikudLasud[i];
                let olemas = väärtus !== undefined;
                let ümardatud = olemas ? Math.floor(väärtus) : 0;
                
                if (olemas) {
                    algneSumma += väärtus;
                    ümardatudSumma += ümardatud;
                }

                tabeliHtml += `<tr>
                    <td>${i + 1}. lask</td>
                    <td>${olemas ? väärtus.toFixed(1) : '-'}</td>
                    <td><strong>${olemas ? ümardatud : '-'}</strong></td>
                </tr>`;
            }

            tabeliHtml += `<tr class="total-row"><td>KOKKU</td><td>${algneSumma.toFixed(1)}</td><td>${ümardatudSumma}</td></tr>`;
            tabeliHtml += `</table>`;
            
            tableOutput.innerHTML = tabeliHtml;
        } else {
            tableOutput.innerHTML = "<p style='color:red;'>Kärbitud pildilt ei leitud numbreid. Veendu, et pildistad otse ekraani eest, nii et tulemuste tabel jääks paremale üles nurka.</p>";
        }
    }
</script>

</body>
</html>
