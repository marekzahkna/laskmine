<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ühenduse Test v2.6</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .version-tag { font-size: 0.85em; color: #777; background: #eaeaea; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .key-section { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 1.1em; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #218838; }
        
        /* Visuaalne konsool silumiseks */
        .console-box { background: #1e1e1e; color: #39ff14; font-family: monospace; padding: 15px; border-radius: 6px; margin-top: 25px; max-height: 250px; overflow-y: auto; white-space: pre-wrap; box-shadow: inset 0 0 10px #000; }
        .log-error { color: #ff3333; }
        .log-success { color: #00ffffff; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Ühenduse Test (Lihtne Tekst)</h2>
    <div class="version-tag">Rakenduse versioon: v2.6 (Diagnostika & Konsool)</div>
    
    <!-- VÕTME SISSESTAMISE OSA -->
    <div class="key-section">
        <label style="font-weight: bold;">Sisesta oma Hugging Face tasuta võti (alustab 'hf_...'):</label>
        <input type="text" id="apiKeyInput" placeholder="hf_...">
    </div>

    <p>See nupp ei vaja pilti. Saame teada, kas andmed liiguvad arvutist serverisse ja kas võti töötab.</p>
    <button id="testBtn" class="btn">Käivita ühenduse test</button>

    <h3>Koodi samm-sammuline konsool (Silumine):</h3>
    <div id="consoleOutput" class="console-box">[Süsteem] Ootan testi käivitamist...</div>
</div>

<script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const testBtn = document.getElementById('testBtn');
    const consoleOutput = document.getElementById('consoleOutput');

    // Abifunktsioon konsooli kirjutamiseks
    function logi(tekst, tyyp = 'info') {
        const aeg = new Date().toLocaleTimeString();
        let klass = '';
        if (tyyp === 'error') klass = 'class="log-error"';
        if (tyyp === 'success') klass = 'class="log-success"';
        
        consoleOutput.innerHTML += `<div ${klass}>[${aeg}] ${tekst}</div>`;
        consoleOutput.scrollTop = consoleOutput.scrollHeight; // Keri alati alla
    }

    // Laadime võtme mälust
    if (localStorage.getItem('hf_api_key')) {
        apiKeyInput.value = localStorage.getItem('hf_api_key');
        logi("Võti laeti seadme mälust edukalt.");
    }

    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('hf_api_key', apiKeyInput.value.trim());
    });

    testBtn.addEventListener('click', async function() {
        const apiKey = apiKeyInput.value.trim();
        
        consoleOutput.innerHTML = ""; // Puhastame konsooli uueks testiks
        logi("Test käivitatud kasutaja poolt.");

        if (!apiKey) {
            logi("VIGA: Päring peatati, sest võtme kast on tühi!", "error");
            return;
        }

        logi(`Kontrollin võtit... Algab sümbolitega: "${apiKey.substring(0, 7)}..."`);
        logi("Valmistun veebipäringuks (Fetch)...");
        logi("Sihtkoht: https://huggingface.co");

        // Paneme kokku Sinu küsitud lihtsa andmejada (puhta teksti formaat)
        const andmed = {
            model: "microsoft/Phi-3.5-vision-instruct",
            messages: [
                {
                    role: "user",
                    content: "Hello! This is a connection test from a local HTML file. Please respond with exactly one word: KORRAS."
                }
            ],
            max_tokens: 10
        };

        logi("Andmeplokk (JSON) kokku pandud. Päring teele saadetud...");

        try {
            const response = await fetch("https://huggingface.co", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(andmed)
            });

            logi(`Server vastas! HTTP staatuse kood: ${response.status} (${response.statusText})`);

            if (!response.ok) {
                logi(`Server lükkas päringu tagasi (Staatuse kood ei ole 200).`, "error");
            }

            logi("Hakkan serveri vastust (JSON-i) lahti pakkima...");
            const result = await response.json();
            logi("Andmed lahti pakitud. Analüüsin sisu...");

            if (result.error) {
                logi(`AI SERVERI SISAMINE VIGA: ${JSON.stringify(result.error)}`, "error");
                return;
            }

            if (result.choices && result.choices[0] && result.choices[0].message) {
                const aiVastus = result.choices[0].message.content.trim();
                logi(`AI VASTAS: "${aiVastus}"`, "success");
                
                if (aiVastus.toUpperCase().includes("KORRAS")) {
                    logi("TEST ÕNNESTUS 100%! Sinu arvuti saab pilveserveriga ametlikult ühendust.", "success");
                } else {
                    logi("Side toimib, kuid AI saatis oodatust erineva teksti.", "info");
                }
            } else {
                logi(`Vastuse struktuur oli ootamatu: ${JSON.stringify(result)}`, "error");
            }

        } catch (error) {
            logi("KRIITILINE TÕRGE: Päring katkes enne serverini jõudmist või brauser blokeeris selle!", "error");
            logi(`Vea täpne tehniline kirjeldus: "${error.message}"`, "error");
            logi("Kui siin on kirjas 'Failed to fetch', siis brauseris on endiselt aktiivne sisemine blokeering või internet puudub.", "error");
        }
    });
</script>

</body>
</html>
